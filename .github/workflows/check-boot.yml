name: Check Boot Image Format

on:
  workflow_dispatch:

jobs:
  unpack-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Download boot.img
        run: curl -L "https://sourceforge.net/projects/plato-evox/files/EvolutionX-16.0-20260514-plato-11.7-Unofficial/boot.img/download" -o boot.img

      - name: Run script
        run: |
          cat << 'EOF' > check_boot.sh
          #!/bin/bash
          
          err() {
              echo "[ERROR] $*" >&2
              [ -n "${temp:-}" ] && rm -rf "$temp"
              exit 1
          }
          
          check_cmd() {
              command -v "$1" &>/dev/null
          }
          
          install_magiskboot() {
              local magisk_url
              magisk_url=$(curl -s https://api.github.com/repos/topjohnwu/Magisk/releases/latest | grep "browser_download_url.*apk" | cut -d '"' -f 4)
              curl -L "$magisk_url" -o magisk.apk
              unzip -j magisk.apk "lib/x86_64/libmagiskboot.so" -d .
              mv libmagiskboot.so magiskboot
              chmod +x magiskboot
              sudo mv magiskboot /usr/local/bin/
              rm magisk.apk
          }
          
          if ! check_cmd "magiskboot"; then
              install_magiskboot
          fi
          
          boot_path=$(realpath "$1")
          if [ -z "${boot_path:-}" ]; then
              err "boot.img required."
          elif [ ! -f "$boot_path" ]; then
              err "File '$boot_path' doesn't exist."
          fi
          
          temp=$(mktemp -d)
          pushd "$temp" >/dev/null || err "pushd failed"
          
          dst="$temp/$(basename "$boot_path")"
          cp "$boot_path" "$dst"
          boot_path="$dst"
          
          output=$(magiskboot unpack "$boot_path" 2>&1)
          rc=$?
          
          if [ "$rc" -ne 0 ]; then
              echo "$output"
              err "Failed to unpack boot image"
          fi
          
          kernel_fmt=$(echo "$output" | grep 'KERNEL_FMT' | awk '{print $2}' | cut -f2 -d '[' | cut -f1 -d ']')
          
          echo "Your kernel format is $kernel_fmt"
          
          popd >/dev/null || err "popd failed"
          rm -rf "$temp"
          exit 0
          EOF
          
          chmod +x check_boot.sh
          ./check_boot.sh boot.img > output.txt
          cat output.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot-format-output
          path: output.txt
